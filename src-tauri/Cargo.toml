[package]
name = "lol-settings-changer"
version = "0.1.0"
description = "LoL Settings Changer"
authors = ["LoL Settings Changer"]
license = ""
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "1.6", features = ["dialog-open"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
